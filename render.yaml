services:
  - type: web
    name: locksmith-academy-quiz
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: PASS_MARK
        value: "80"
      - key: DATABASE_URL
        fromDatabase:
          name: locksmith-academy-db
          property: connectionString

databases:
  - name: locksmith-academy-db
    plan: basic-256mb
    databaseName: locksmith_academy
    user: locksmith_academy_user
